plugins { id 'com.android.application' }

android {
    namespace 'com.rajan.rsflow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rajan.rsflow.studio'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.6.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
