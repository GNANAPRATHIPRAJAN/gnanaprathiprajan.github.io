name: S-Square Android smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'S-Square/release/*.apk'
      - 'S-Square/verification/device_smoke.py'
      - '.github/workflows/s-square-android.yml'
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/square-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' "$image"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 4
          done
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n square -k "$image" --device pixel_6
          test -s "$ANDROID_AVD_HOME/square.ini"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" -avd square -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on > "$RUNNER_TEMP/square-emulator.log" 2>&1 &
          emulator_pid=$!
          for n in {1..100}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/square-emulator.log"; exit 1; fi
            if adb devices | grep -q "emulator-.*device$"; then break; fi
            sleep 2
          done
          if ! timeout 15 adb wait-for-device; then cat "$RUNNER_TEMP/square-emulator.log"; exit 1; fi
          for n in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 3
          done
          if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]]; then tail -100 "$RUNNER_TEMP/square-emulator.log"; exit 1; fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
      - name: Exercise signed launcher
        run: python3 -u S-Square/verification/device_smoke.py S-Square/release/S-Square-2.6.0.apk
